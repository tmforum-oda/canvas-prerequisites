# This Secret stores credentials for Keycloak and Postgres.
# The annotation helm.sh/resource-policy: keep prevents Helm from overwriting this Secret
# during upgrades, preserving existing credentials and allowing safe chart upgrades.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-credentials
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  keycloak-admin-user: {{ .Values.keycloak.adminUser | b64enc }}
  keycloak-admin-password: {{ if .Values.keycloak.adminPassword | trim | len | eq 0 }}{{ randAlphaNum 8 | b64enc }}{{ else }}{{ .Values.keycloak.adminPassword | b64enc }}{{ end }}
  postgres-user: {{ .Values.postgres.user | b64enc }}
  postgres-password: {{ if .Values.postgres.password | trim | len | eq 0 }}{{ randAlphaNum 8 | b64enc }}{{ else }}{{ .Values.postgres.password | b64enc }}{{ end }}
