apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ include "keycloak.fullname" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  serviceName: keycloak-discovery
  replicas: {{ .Values.keycloak.replicas }}
  selector:
    matchLabels:
      {{- include "keycloak.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "keycloak.labels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command:
            - sh
            - -c
            - >
              until nc -z {{ .Release.Name }}-postgres {{ .Values.postgres.service.port }}; do echo "Waiting for postgres..."; sleep 2; done
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          args: ["start"]
          env:
            - name: KC_FEATURE_TOKEN_EXCHANGE_DELEGATION
              value: "{{ .Values.keycloak.feature.tokenExchangeDelegation }}"
            - name: KC_FEATURE_PARAMETERIZED_SCOPES
              value: "{{ .Values.keycloak.feature.parameterizedScopes }}"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: keycloak-admin-user
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: keycloak-admin-password
            # In a production environment, add a TLS certificate to Keycloak to either end-to-end encrypt the traffic between
            # the client or Keycloak, or to encrypt the traffic between your proxy and Keycloak.
            # Respect the proxy headers forwarded by the reverse proxy
            # In a production environment, verify which proxy type you are using, and restrict access to Keycloak
            # from other sources than your proxy if you continue to use proxy headers.
            - name: KC_PROXY_HEADERS
              value: "{{ .Values.keycloak.proxyHeaders }}"
            - name: KC_HTTP_ENABLED
              value: "{{ .Values.keycloak.httpEnabled }}"
            # In this explorative setup, no strict hostname is set.
            # For production environments, set a hostname for a secure setup.
            - name: KC_HOSTNAME_STRICT
              value: "{{ .Values.keycloak.hostnameStrict }}"
            - name: KC_HEALTH_ENABLED
              value: "{{ .Values.keycloak.healthEnabled }}"
            - name: 'KC_CACHE'
              value: "{{ .Values.keycloak.cache }}"
            # Passing the Pod's IP primary address to the JGroups clustering as this is required in IPv6 only setups
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Instruct JGroups which DNS hostname to use to discover other Keycloak nodes
            # Needs to be unique for each Keycloak cluster
            - name: KC_CACHE_EMBEDDED_NETWORK_BIND_ADDRESS
              value: '$(POD_IP)'
            - name: 'KC_DB_URL_DATABASE'
              value: "{{ .Values.postgres.database }}"
            - name: 'KC_DB_URL_HOST'
              value: "{{ .Release.Name }}-postgres"
            - name: 'KC_DB'
              value: "postgres"
            # In a production environment, use a secret to store username and password to the database
            - name: 'KC_DB_PASSWORD'
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: postgres-password
            - name: 'KC_DB_USERNAME'
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: postgres-user
          ports:
            - name: http
              containerPort: 8080
            - name: jgroups
              containerPort: 7800
            - name: jgroups-fd
              containerPort: 57800
          startupProbe:
            httpGet:
              path: /health/started
              port: {{ .Values.keycloak.service.healthPort }}
            periodSeconds: 1
            failureThreshold: 600              
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.keycloak.service.healthPort }}
            periodSeconds: 10
            failureThreshold: 3              
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.keycloak.service.healthPort }}
            periodSeconds: 10
            failureThreshold: 3              
          resources:
            requests:
              cpu: {{ .Values.keycloak.resources.requests.cpu }}
              memory: {{ .Values.keycloak.resources.requests.memory }}
            limits:
              cpu: {{ .Values.keycloak.resources.limits.cpu }}
              memory: {{ .Values.keycloak.resources.limits.memory }}
          volumeMounts:
            # ...existing mounts...
            - name: realm-config
              mountPath: /realm
      volumes:
        # ...existing volumes...
        - name: realm-config
          configMap:
            name: {{ include "keycloak.fullname" . }}-realm