apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ include "keycloak.fullname" . }}-discovery
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "keycloak.selectorLabels" . | nindent 4 }}
  clusterIP: None
  type: ClusterIP
  ports:
    - name: jgroups
      port: 7800
      targetPort: 7800