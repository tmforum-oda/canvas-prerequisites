apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    {{- include "keycloak-helm.labels" . | nindent 4 }}
spec:
  ports:
    - protocol: TCP
      port: {{ .Values.keycloak.service.port }}
      targetPort: http
      name: http
    - protocol: TCP
      port: {{ .Values.keycloak.service.healthPort }}
      targetPort: {{ .Values.keycloak.service.healthPort }}
      name: health
  selector:
    {{- include "keycloak-helm.selectorLabels" . | nindent 4 }}
  type: {{ .Values.keycloak.service.type }}