apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "keycloak.fullname" . }}-config-cli
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "keycloak.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "keycloak.fullname" . }}-config-cli
          image: "{{ .Values.keycloak.configCli.image.repository }}:{{ .Values.keycloak.configCli.image.tag }}"
          env:
            - name: KEYCLOAK_URL
              value: "http://{{ include "keycloak.fullname" . }}:{{ .Values.keycloak.service.port }}"
            - name: KEYCLOAK_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: keycloak-admin-user
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-credentials
                  key: keycloak-admin-password
            - name: JAVA_OPTS
              value: ""
            - name: KEYCLOAK_SSL_VERIFY
              value: "true"
            - name: IMPORT_FILES_LOCATIONS
              value: "file:/config/*"
          command:
            - sh
            - -c
            - |
              until wget -qO- http://{{ include "keycloak.fullname" . }}:{{ .Values.keycloak.service.healthPort }}/health/ready; do
                echo "Waiting for Keycloak to be healthy...";
                sleep 5;
              done
              exec java $JAVA_OPTS -jar /app/keycloak-config-cli.jar "$@"
          volumeMounts:
            - name: realm-config
              mountPath: /config
      restartPolicy: OnFailure
      volumes:
        - name: realm-config
          configMap:
            name: {{ include "keycloak.fullname" . }}-realm
