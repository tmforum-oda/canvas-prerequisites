# Namespace where Postgres is deployed
namespace: keycloak

# Secret name for Postgres credentials (should match the Keycloak secret name)
# The credentials secret is always named {{ .Release.Name }}-credentials
image:
  repository: docker.io/postgres
  tag: "18"
user: keycloak
password: keycloak
database: keycloak
service:
  port: 5432
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1024Mi
