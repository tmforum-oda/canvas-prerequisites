# Keycloak configuration
keycloak:
  image:
    repository: quay.io/keycloak/keycloak  # Keycloak image repo
    tag: 26.4.2                            # Keycloak image tag
  replicas: 1                              # Number of Keycloak pods
  resources:                               # Pod resource requests/limits
    requests:
      cpu: 500m
      memory: 1700Mi
    limits:
      cpu: 2000m
      memory: 2000Mi
  service:
    type: LoadBalancer                     # Service type
    port: 8080                             # Service port
    healthPort: 9000                       # Health endpoint port
  adminUser: "admin"                            # Admin username (default)
  adminPassword: ""                             # Admin password (set blank for generation)
  hostnameStrict: false                    # Hostname strict mode
  healthEnabled: true                      # Enable health checks
  cache: ispn                              # Cache provider
  proxyHeaders: xforwarded                 # Proxy header mode
  httpEnabled: true                        # Enable HTTP
  importJob:
    enabled: false
  configCli:
    image:
      repository: quay.io/adorsys/keycloak-config-cli
      tag: 6.4.0-26
postgres:
  image:
    repository: mirror.gcr.io/postgres
    tag: "17"
  user: "keycloak"                              # DB username (default)
  password: ""                                  # DB password (set blank for generation)
  database: keycloak
  service:
    port: 5432
