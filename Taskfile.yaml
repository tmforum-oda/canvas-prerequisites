version: '3'

vars:
  HELM_OS: linux
  HELM_ARCH: amd64
  HELM_VERSION: v3.19.0

tasks:
  clone-repo:
    desc: Clone the canvas-prerequisites repository
    cmds:
      - echo "Please clone the repository manually: git clone <repo-url>"

  install-helm:
    desc: Install Helm (assumes you have admin rights to run `install`)
    cmds:
      - curl -LO https://get.helm.sh/helm-${HELM_VERSION}-${HELM_OS}-${HELM_ARCH}.tar.gz
      - tar -zxvf helm-${HELM_VERSION}-${HELM_OS}-${HELM_ARCH}.tar.gz
      - sudo install ${HELM_OS}-${HELM_ARCH}/helm /usr/local/bin/
      - rm -rf ${HELM_OS}-${HELM_ARCH} helm-${HELM_VERSION}-${HELM_OS}-${HELM_ARCH}.tar.gz

  add-istio-repo:
    desc: Add the Istio Helm repository
    deps: [install-helm]
    cmds:
      - helm repo add istio https://istio-release.storage.googleapis.com/charts
      - helm repo update

  install-istio:
    desc: Install Istio base and control plane
    deps: [add-istio-repo]
    cmds:
      - helm install istio-base istio/base
      - helm install istiod istio/istiod

  install-prerequisites-chart:
    desc: Install the canvas-prerequisites chart-of-charts
    deps: [install-istio]
    cmds:
      - helm install prerequisites ./charts

  install-all:
    desc: Install all prerequisites for ODA Canvas
    cmds:
      - task: install-helm
      - task: install-istio
      - task: install-prerequisites-chart
      - echo "All prerequisites installed."